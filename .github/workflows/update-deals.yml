name: Update ski deals data

on:
  schedule:
    - cron: "15 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-deals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh deals data
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USERNAME: ${{ vars.REDDIT_USERNAME }}
        run: npm run scan:deals

      - name: Refresh ski news
        # A news failure must not cost the day's deals update.
        continue-on-error: true
        run: npm run scan:news

      - name: Commit updated deals data
        run: |
          if git diff --quiet -- src/data/deals.json src/data/news.json; then
            echo "No deals or news changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/deals.json src/data/news.json
          git commit -m "chore: update ski deals and news data"
          git push
